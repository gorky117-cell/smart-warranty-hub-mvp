[phases.setup]
nixPkgs = ["python311", "tesseract", "glib", "libGL", "libICE", "libSM", "libXext", "libXrender", "poppler_utils", "zlib", "stdenv.cc.cc.lib"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "python -m pip install -r requirements.txt"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
