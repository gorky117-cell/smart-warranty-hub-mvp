{# Shared <head> for public pages. Expects: page_title, page_description, canonical_path, robots (optional). #}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_description }}">
<meta name="robots" content="{{ robots or 'index,follow' }}">
<link rel="canonical" href="https://www.smartwarrantyhub.com{{ canonical_path }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Smart Warranty Hub">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:url" content="https://www.smartwarrantyhub.com{{ canonical_path }}">
<meta property="og:image" content="https://www.smartwarrantyhub.com/static/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Smart Warranty Hub - The after-purchase bridge between you and your brands">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="https://www.smartwarrantyhub.com/static/brand/og-image.png">
<meta name="theme-color" content="#0F1B3D">
{% if google_site_verification is defined and google_site_verification() %}<meta name="google-site-verification" content="{{ google_site_verification() }}">
{% endif %}<link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/site.css">
